<!DOCTYPE html>
<html>
<head>
    <title>Stock Fundamentals Checker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { margin: 20px; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-primary">Stock Fundamentals Checker</h1>
        <form action="/stock" method="POST">
            <div class="mb-3">
                <label for="stock_name" class="form-label">Choose a stock:</label>
                <select name="stock_name" id="stock_name" class="form-select" required>
                    <option value="" disabled selected>Select a stock</option>
                    {% for stock in stocks %}
                    <option value="{{ stock }}">{{ stock }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-success">Check Fundamentals</button>
        </form>
    </div>
</body>
</html>
